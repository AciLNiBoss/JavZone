<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>JAV Stream Zone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary-color: crimson;
      --background-color: #121212;
      --surface-color: #1e1e1e;
      --text-color: #e0e0e0;
      --text-muted-color: #a0a0a0;
      --accent-color: limegreen;
    }
    body {
      margin: 0;
      background: var(--background-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      text-align: center;
      padding: 20px 0;
      background: var(--surface-color);
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 15px;
      background: #1a1a1a;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    .controls input, .controls select {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #2c2c2c;
      color: var(--text-color);
      font-size: 14px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      padding: 25px;
      max-width: 1400px;
      margin: auto;
    }
    .card {
      background: var(--surface-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .card .thumbnail {
        position: relative;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .duration {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
    }
    .card .content {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .tags { margin-bottom: 12px; }
    .tag {
      background: var(--primary-color);
      padding: 4px 10px;
      margin-right: 6px;
      margin-bottom: 6px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 500;
      display: inline-block;
      text-transform: uppercase;
    }
    .desc {
      font-size: 14px;
      color: var(--text-muted-color);
      margin-bottom: 15px;
      flex-grow: 1;
    }
    .meta {
        font-size: 13px;
        color: gold;
        margin-bottom: 15px;
    }
    .btn {
      background: var(--accent-color);
      color: black;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover { background: #00e600; }
    .pagination {
      text-align: center;
      padding: 20px 0 40px;
    }
    .pagination-inner {
      display: inline-flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: var(--surface-color);
      border-radius: 50px;
    }
    .pagination button {
      background: #333;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .pagination button:hover:not(:disabled) {
        background: #555;
    }
    .pagination button.active {
      background: var(--primary-color);
      font-weight: bold;
    }
  </style>
  <script type='text/javascript' src='//pl20555183.profitableratecpm.com/d7/64/13/d7641348ab2a4d56566cbe52113b7c6c.js'></script>
</head>
<body>

<h1 data-lang="siteTitle">JAV Stream Zone</h1>

<div class="controls">
  <input type="text" id="search" data-lang-placeholder="searchPlaceholder">
  <select id="filter">
    <option value="all" data-lang="filterAll">Semua</option>
    <option value="trending" data-lang="filterTrending">Trending</option>
    <option value="new" data-lang="filterNew">Baru</option>
    <option value="viral" data-lang="filterViral">Viral</option>
  </select>
  <select id="language">
    <option value="id">🇮🇩 Indonesia</option>
    <option value="en">🇺🇸 English</option>
  </select>
</div>

<div class="gallery" id="gallery"></div>
<div class="pagination" id="pagination"></div>

<script>
let currentLang = 'id';

const translations = {
  id: {
    siteTitle: 'JAV Stream Zone',
    searchPlaceholder: 'Cari video berdasarkan judul atau aktris...',
    filterAll: 'Semua',
    filterTrending: 'Trending',
    filterNew: 'Baru',
    filterViral: 'Viral',
    watchButton: '▶️ Tonton Sekarang',
    viewsText: 'tayangan',
    descTemplate: (actress, code) => `${actress} tampil memukau dalam rilisan terbaru ${code}. Streaming gratis dengan kualitas premium!`,
    tags: {
        "18+ Only": "18+ Saja",
        "Full HD": "Full HD",
        "Uncensored": "Tanpa Sensor",
        "Censored": "Sensor"
    }
  },
  en: {
    siteTitle: 'JAV Stream Zone',
    searchPlaceholder: 'Search by title or actress...',
    filterAll: 'All',
    filterTrending: 'Trending',
    filterNew: 'New',
    filterViral: 'Viral',
    watchButton: '▶️ Watch Now',
    viewsText: 'views',
    descTemplate: (actress, code) => `${actress} gives a stunning performance in the latest release ${code}. Stream for free in premium quality!`,
    tags: {
        "18+ Only": "18+ Only",
        "Full HD": "Full HD",
        "Uncensored": "Uncensored",
        "Censored": "Censored"
    }
  }
};

const data = Array.from({length: 130}, (_, i) => {
  const codes = ["SSIS", "IPX", "MIDE", "JUQ", "DASD", "FSDSS", "CAWD", "HMN", "STARS", "ADN"];
  const names = ["Yua Mikami", "Kana Momonogi", "Eimi Fukada", "Mina Kitano", "Rara Anzai", "Tsukasa Aoi", "Ai Hongo", "Ichika Nagano", "Aika Yumeno", "Nozomi Ishihara"];
  const labels = ["trending", "new", "viral"];
  const code = codes[i % codes.length] + '-' + (500 + i);
  const actress = names[i % names.length];
  const views = Math.floor(Math.random() * 90000 + 10000);
  const durationInMinutes = Math.floor(Math.random() * 111) + 10; // 10 to 120 minutes
  
  return {
    id: i + 1,
    title: `${code} – ${actress}`,
    actress: actress,
    code: code,
    image: `https://pics.dmm.co.jp/mono/movie/adult/${code.toLowerCase().replace('-', '')}/${code.toLowerCase().replace('-', '')}pl.jpg`,
    tags: ["18+ Only", "Full HD", i % 2 === 0 ? "Uncensored" : "Censored"],
    label: labels[i % labels.length],
    views,
    duration: durationInMinutes * 60 // duration in seconds
  };
});

const perPage = 12;
let currentPage = 1;
let searchQuery = '';
let filterValue = 'all';

const gallery = document.getElementById('gallery');
const pagination = document.getElementById('pagination');
const searchInput = document.getElementById('search');
const filterSelect = document.getElementById('filter');
const langSelect = document.getElementById('language');

function formatDuration(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const paddedMinutes = String(minutes).padStart(2, '0');
    const paddedSeconds = String(seconds).padStart(2, '0');

    if (hours > 0) {
        return `${hours}:${paddedMinutes}:${paddedSeconds}`;
    }
    return `${paddedMinutes}:${paddedSeconds}`;
}

function render() {
  gallery.innerHTML = '';
  const langPack = translations[currentLang];

  let filtered = data.filter(d =>
    (d.title.toLowerCase().includes(searchQuery.toLowerCase())) &&
    (filterValue === 'all' || d.label === filterValue)
  );

  const totalPages = Math.ceil(filtered.length / perPage);
  currentPage = Math.max(1, Math.min(currentPage, totalPages));

  const start = (currentPage - 1) * perPage;
  const items = filtered.slice(start, start + perPage);

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const translatedTags = item.tags.map(tag => `<span class='tag'>${langPack.tags[tag] || tag}</span>`).join(' ');
    
    card.innerHTML = `
      <div class="thumbnail">
        <img src="${item.image}" alt="${item.title}" loading="lazy">
        <div class="duration">${formatDuration(item.duration)}</div>
      </div>
      <div class="content">
        <div class="title">${item.title}</div>
        <div class="tags">${translatedTags}</div>
        <div class="desc">${langPack.descTemplate(item.actress, item.code)}</div>
        <div class="meta">👁️ ${item.views.toLocaleString()} ${langPack.viewsText}</div>
        <a href="https://www.profitableratecpm.com/kjn49xb8x?key=fdb96d8d2c9dd18d50af20484e53e970" class="btn" target="_blank">${langPack.watchButton}</a>
      </div>
    `;
    gallery.appendChild(card);
  });

  renderPagination(totalPages, filtered.length);
}

function renderPagination(totalPages, totalItems) {
    pagination.innerHTML = '';
    if (totalItems <= perPage) return;

    const paginationInner = document.createElement('div');
    paginationInner.className = 'pagination-inner';

    const prevBtn = document.createElement('button');
    prevBtn.innerHTML = '&#x2190;'; // Left arrow
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; render(); window.scrollTo(0,0); } };
    paginationInner.appendChild(prevBtn);

    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, currentPage + 2);

    if (currentPage <= 3) {
        endPage = Math.min(5, totalPages);
    }
    if (currentPage > totalPages - 3) {
        startPage = Math.max(1, totalPages - 4);
    }

    if (startPage > 1) {
        const firstBtn = document.createElement('button');
        firstBtn.innerText = 1;
        firstBtn.onclick = () => { currentPage = 1; render(); window.scrollTo(0,0);};
        paginationInner.appendChild(firstBtn);
        if (startPage > 2) {
            const ellipsis = document.createElement('button');
            ellipsis.innerText = '...';
            ellipsis.disabled = true;
            paginationInner.appendChild(ellipsis);
        }
    }
    
    for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; render(); window.scrollTo(0,0); };
        paginationInner.appendChild(btn);
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
            const ellipsis = document.createElement('button');
            ellipsis.innerText = '...';
            ellipsis.disabled = true;
            paginationInner.appendChild(ellipsis);
        }
        const lastBtn = document.createElement('button');
        lastBtn.innerText = totalPages;
        lastBtn.onclick = () => { currentPage = totalPages; render(); window.scrollTo(0,0); };
        paginationInner.appendChild(lastBtn);
    }


    const nextBtn = document.createElement('button');
    nextBtn.innerHTML = '&#x2192;'; // Right arrow
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; render(); window.scrollTo(0,0); } };
    paginationInner.appendChild(nextBtn);

    pagination.appendChild(paginationInner);
}

function updateLanguageUI() {
    const langPack = translations[currentLang];
    document.documentElement.lang = currentLang;
    
    document.querySelector('[data-lang="siteTitle"]').innerText = langPack.siteTitle;
    document.querySelector('[data-lang-placeholder="searchPlaceholder"]').placeholder = langPack.searchPlaceholder;
    document.querySelector('[data-lang="filterAll"]').innerText = langPack.filterAll;
    document.querySelector('[data-lang="filterTrending"]').innerText = langPack.filterTrending;
    document.querySelector('[data-lang="filterNew"]').innerText = langPack.filterNew;
    document.querySelector('[data-lang="filterViral"]').innerText = langPack.filterViral;
    
    render();
}

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  currentPage = 1;
  render();
});

filterSelect.addEventListener('change', e => {
  filterValue = e.target.value;
  currentPage = 1;
  render();
});

langSelect.addEventListener('change', e => {
  currentLang = e.target.value;
  updateLanguageUI();
});

// Initial load
updateLanguageUI();

</script>
</body>
</html>
